<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0d0b09" />
<meta name="apple-mobile-web-app-title" content="Silent Bell" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Harbor of the Silent Bell</title>
<style>
  :root {
    --ink:#e8dcc0; --dim:#9a8b6e; --bg:#0d0b09; --panel:#1a1510;
    --iron:#3a3228; --gold:#c9a227; --blood:#8b2a2a;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:Palatino,"Palatino Linotype",Georgia,serif; overscroll-behavior:none; touch-action:manipulation; }
  #app { display:flex; flex-direction:column; height:100dvh; height:100svh;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b); padding-left:var(--safe-l); padding-right:var(--safe-r); }
  header { display:flex; justify-content:space-between; align-items:center; padding:8px 14px;
    background:#120f0c; border-bottom:1px solid var(--iron); font-size:14px; flex-shrink:0; }
  header b { color:var(--gold); }
  #screens { flex:1; position:relative; overflow:hidden; }
  .screen { display:none; position:absolute; inset:0; }
  .screen.active { display:flex; flex-direction:column; }
  .center { align-items:center; justify-content:center; text-align:center; padding:24px; }
  h1 { font-size:26px; margin:0 0 8px; color:var(--gold); }
  h2 { font-size:18px; color:var(--gold); margin:0 0 10px; }
  p.lead { max-width:540px; color:var(--dim); }
  button, select { background:#2a221a; color:var(--ink); border:1px solid var(--gold);
    padding:8px 14px; font-family:inherit; cursor:pointer; margin:4px; min-height:44px; font-size:16px; }
  button.ghost { border-color:var(--iron); color:var(--dim); }
  input[type=text] { background:#120f0c; color:var(--ink); border:1px solid var(--iron);
    padding:8px 10px; font-family:inherit; min-height:44px; font-size:16px; width:220px; max-width:100%; }
  .row { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .card { background:var(--panel); border:1px solid var(--iron); padding:14px; min-width:200px; text-align:left; }
  .stats { display:grid; grid-template-columns:70px 40px 36px; gap:4px 8px; }
  .gold { color:var(--gold); } .rare { color:#6ea8d8; } .epic { color:#b07ad6; } .legendary { color:#d4a017; }
  #worldWrap { flex:1; display:flex; min-height:0; }
  canvas { display:block; background:#0c1410; }
  canvas#view, canvas#grid, canvas#wmap { flex:1; touch-action:none; }
  #side { width:280px; background:#120f0c; border-left:1px solid var(--iron); padding:10px; overflow:auto; font-size:13px; }
  #log { height:88px; overflow:auto; background:#0a0806; padding:8px; border-top:1px solid var(--iron);
    font-size:12px; color:var(--dim); flex-shrink:0; -webkit-overflow-scrolling:touch; }
  #combatUI { padding:8px 12px; background:#120f0c; border-top:1px solid var(--iron); flex-shrink:0; }
  #pad { display:none; flex-shrink:0; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 12px 10px; background:#120f0c; border-top:1px solid var(--iron); }
  .dpad { display:grid; grid-template-columns:56px 56px 56px; grid-template-rows:56px 56px 56px; gap:4px; }
  .dpad button { margin:0; min-height:56px; min-width:56px; padding:0; font-size:20px; }
  .dpad .n { grid-column:2; grid-row:1; } .dpad .w { grid-column:1; grid-row:2; }
  .dpad .e { grid-column:3; grid-row:2; } .dpad .s { grid-column:2; grid-row:3; }
  #actBtns { display:flex; flex-direction:column; gap:8px; }
  #actBtns button { min-width:112px; margin:0; }
  #sheetToggle { display:none; }
  #modal { display:none; position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.72);
    align-items:flex-end; justify-content:center; padding:12px; padding-bottom:calc(12px + var(--safe-b)); }
  #modal.open { display:flex; }
  #modal .sheet { background:var(--panel); border:1px solid var(--gold); width:min(520px,100%);
    max-height:78dvh; overflow:auto; padding:16px; }
  #modal .sheet button { width:100%; margin:6px 0; }
  .purse { color:var(--gold); font-size:15px; margin:0 0 10px; }
  .hint { color:var(--dim); font-size:12px; }
  .hp { height:8px; background:#2a1515; margin:4px 0 8px; } .hp>i { display:block; height:100%; background:var(--blood); }
  table.items { width:100%; border-collapse:collapse; font-size:12px; }
  table.items td { padding:3px 4px; border-bottom:1px solid #2a221a; }
  @media (max-width:900px) {
    header { font-size:12px; }
    #worldWrap { flex-direction:column; }
    #side { display:none; position:absolute; left:0; right:0; bottom:0; width:100%;
      height:min(52vh,420px); border-left:0; border-top:1px solid var(--gold); z-index:5; }
    #side.open { display:block; }
    #pad { display:flex; } #sheetToggle { display:inline-block; }
    .card { min-width:0; width:100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span><b>Harbor of the Silent Bell</b></span>
    <span id="hud">—</span>
  </header>
  <div id="screens">
    <section id="title" class="screen center active">
      <h1>Harbor of the Silent Bell</h1>
      <p class="lead">Isometric living dock. Roll an Avatar. The stables are not quiet. The west road leaves town.</p>
      <div>
        <button onclick="show('chargen')">Create Avatar</button>
        <button class="ghost" onclick="quickStart()">Quick start</button>
      </div>
    </section>

    <section id="chargen" class="screen" style="padding:16px;overflow:auto">
      <h2>Create the Avatar</h2>
      <div class="row">
        <div class="card">
          <label>Name<br><input id="cgName" type="text" value="Aric" /></label>
          <p>Race</p><select id="cgRace" onchange="refreshChargen()"></select>
          <p>Class</p><select id="cgClass" onchange="refreshChargen()"></select>
          <p>Alignment</p>
          <select id="cgAlign">
            <option>Lawful Good</option><option>Neutral Good</option><option>Chaotic Good</option>
            <option selected>Lawful Neutral</option><option>True Neutral</option><option>Chaotic Neutral</option>
            <option>Lawful Evil</option><option>Neutral Evil</option><option>Chaotic Evil</option>
          </select>
          <p>Roll method</p>
          <select id="cgMethod" onchange="rollStats()">
            <option value="V" selected>Method V — 4d6 drop lowest</option>
            <option value="I">Method I — 3d6 in order</option>
            <option value="II">Method II — 3d6 twice keep high</option>
          </select>
        </div>
        <div class="card">
          <div class="stats" id="cgStats"></div>
          <p class="hint" id="cgWarn"></p>
          <p class="hint" id="cgMem">Saved slot: empty · History: 0</p>
          <button onclick="rollStats()">Reroll</button>
          <button class="ghost" onclick="undoRoll()">Undo last roll</button>
          <button class="ghost" onclick="saveRoll()">Save this roll</button>
          <button class="ghost" onclick="loadSaved()">Load saved</button>
          <button onclick="confirmAvatar()">Enter the harbor</button>
        </div>
      </div>
    </section>

    <section id="world" class="screen">
      <div id="worldWrap">
        <canvas id="view"></canvas>
        <aside id="side"><div id="sheet"></div><hr style="border-color:var(--iron)"><div id="inv"></div></aside>
      </div>
      <div id="log"></div>
      <div id="pad">
        <div class="dpad">
          <button class="n" type="button" ontouchstart="padMove(0,-1,event)" onclick="padMove(0,-1,event)">▲</button>
          <button class="w" type="button" ontouchstart="padMove(-1,0,event)" onclick="padMove(-1,0,event)">◄</button>
          <button class="e" type="button" ontouchstart="padMove(1,0,event)" onclick="padMove(1,0,event)">►</button>
          <button class="s" type="button" ontouchstart="padMove(0,1,event)" onclick="padMove(0,1,event)">▼</button>
        </div>
        <div id="actBtns">
          <button type="button" onclick="interactHere()">Use / Talk</button>
          <button type="button" id="sheetToggle" class="ghost" onclick="toggleSheet()">Sheet / Pack</button>
        </div>
      </div>
    </section>

    <section id="wmapscr" class="screen">
      <canvas id="wmap"></canvas>
      <div id="combatUI" style="flex-shrink:0">
        <b>World map</b> · tap a region · Harbor returns to the dock
        <button onclick="returnHarbor()">Back to harbor</button>
      </div>
    </section>

    <section id="combat" class="screen">
      <canvas id="grid"></canvas>
      <div id="combatUI"></div>
    </section>
  </div>
</div>
<div id="modal"><div class="sheet" id="modalBody"></div></div>

<script>
const RACES = {
  Human:{str:0,dex:0,con:0,int:0,wis:0,cha:0},
  Elf:{str:0,dex:1,con:-1,int:0,wis:0,cha:0,ban:['Paladin']},
  Dwarf:{str:0,dex:0,con:1,int:0,wis:0,cha:-1,ban:['Paladin','Mage','Druid','Bard','Illusionist']},
  Halfling:{str:-1,dex:1,con:0,int:0,wis:0,cha:0,ban:['Paladin','Mage','Ranger','Cavalier']},
  Gnome:{str:0,dex:0,con:0,int:1,wis:-1,cha:0,ban:['Paladin','Ranger','Cavalier']},
  'Half-Elf':{str:0,dex:0,con:0,int:0,wis:0,cha:0,ban:['Paladin']}
};
const CLASSES = {
  Fighter:{mins:{str:9},hd:10}, Paladin:{mins:{str:12,dex:8,con:9,int:9,wis:13,cha:17},hd:10},
  Ranger:{mins:{str:13,dex:13,con:14,wis:14},hd:10}, Barbarian:{mins:{str:15,con:14,dex:14},hd:12},
  Cavalier:{mins:{str:15,dex:15,con:15,int:10,wis:10,cha:15},hd:10},
  Mage:{mins:{int:9},hd:4}, Illusionist:{mins:{dex:16,int:9},hd:4}, Necromancer:{mins:{int:9,wis:9},hd:4},
  Cleric:{mins:{wis:9},hd:8}, Druid:{mins:{wis:12,cha:15},hd:8},
  Thief:{mins:{dex:9},hd:6}, Assassin:{mins:{str:12,dex:12,int:11},hd:6},
  Bard:{mins:{dex:12,int:13,cha:15},hd:6}, Monk:{mins:{str:15,dex:15,con:11,wis:15},hd:8},
  Psionicist:{mins:{con:11,int:12,wis:15},hd:6}
};
const ABILS=['str','dex','con','int','wis','cha'];
const RARITY=['Common','Uncommon','Rare','Epic','Legendary'];
const RARITY_CLASS={Common:'',Uncommon:'gold',Rare:'rare',Epic:'epic',Legendary:'legendary'};
const WEIGHTS={
  trash:[78,18,3.5,.45,.05], standard:[62,28,8,1.7,.3], elite:[40,35,18,6,1],
  champion:[25,35,27,10,3], vendor:[70,20,8,1.5,.15], fence:[55,22,18,5,.8], chest:[80,16,3.2,.7,.1]
};
const BASES=[
  ['Rusty Dagger','weapon',4],['Short Sword','weapon',8],['Long Sword','weapon',12],
  ['Battle Axe','weapon',14],['Staff','weapon',6],['Hunting Bow','weapon',9],
  ['Leather Jerkin','armor',6],['Mail Shirt','armor',12],['Steel Helm','armor',8],
  ['Kite Shield','armor',7],['Copper Ring','ring',5],['Silver Amulet','ring',8],
  ['Potion of Mending','use',15],['Identify Scroll','use',20],['Bag of Nails','junk',1],['Loaf','junk',1]
];
const AFFIX=[['Keen',{hit:1}],['Brutal',{dmg:2}],['Stalwart',{ac:1}],['Quick',{dex:1}],
  ['of Wounding',{dmg:1}],['of Defense',{ac:2}],['Flame Tongue',{dmg:3}]];

function d(n){return 1+Math.floor(Math.random()*n)}
function nd(n,s){let t=0;for(let i=0;i<n;i++)t+=d(s);return t}
function fourDrop(){const a=[d(6),d(6),d(6),d(6)].sort((x,y)=>x-y);return a[1]+a[2]+a[3]}
function mod(s){if(s<=3)return-3;if(s<=5)return-2;if(s<=8)return-1;if(s<=12)return 0;if(s<=15)return 1;if(s<=17)return 2;return 3}
function pickWeight(row){const r=Math.random()*100;let a=0;for(let i=0;i<row.length;i++){a+=row[i];if(r<=a)return RARITY[i]}return'Common'}
function rollItem(threat,ilvl){
  const rare=pickWeight(WEIGHTS[threat]||WEIGHTS.trash);
  const base=BASES[Math.floor(Math.random()*BASES.length)];
  const item={name:base[0],slot:base[1],ilvl,rarity:rare,val:base[2]*ilvl,hit:0,dmg:0,ac:0,id:rare==='Common'||rare==='Uncommon'};
  if(rare!=='Common'){
    const n=rare==='Uncommon'?1:rare==='Rare'?2:rare==='Epic'?3:4;
    for(let i=0;i<n;i++){const af=AFFIX[Math.floor(Math.random()*AFFIX.length)];
      item.name=i===0?af[0]+' '+item.name:item.name+' '+af[0];
      Object.assign(item,Object.fromEntries(Object.entries(af[1]).map(([k,v])=>[k,(item[k]||0)+v])));}
  }
  item.shown=item.id?item.rarity+' '+item.name:'Unidentified '+base[0];
  return item;
}

/* maps: . grass  # wall  ~ water  = dock  P cobble  H tavern S stables T temple
   B smith C cup A auction v sewer-grate G town-gate R roof/building walk interior
   E world-map exit  D sewer-down  U sewer-up  K chest  X rat-spawn */
const TOWN = [
"################",
"#EPPPPPPPPPPAAE#",
"#PTTTPPPPPPPAA P#",
"#PTTTPPHHHHPPPP#",
"#PPPPPPHHHHPPPP#",
"#PSSSSPPPPBBBBP#",
"#PSSSSPPPPBBBBP#",
"#PPPPPPPPPPCCCC#",
"#=======PPPPCCC#",
"#=======PPPvPPP#",
"#=======PPPPPPP#",
"#~~~~~~~=======#",
"#~~~~~~~~======#",
"##~~~~~~~~~~~~~~",
"################"
].map(r=>r.replace(/ /g,'P'));
const SEWER = [
"##############",
"#U...K....X..#",
"#.##.##.######",
"#.#.....#.X..#",
"#.#.#####.##.#",
"#K#.......##.#",
"###.######...#",
"#X....K...X..#",
"#.##.######.##",
"#....#....U..#",
"##############"
];
const CH = {
  '#':{walk:false,kind:'wall',h:28},
  '.':{walk:true,kind:'dirt',h:0},
  'P':{walk:true,kind:'cobble',h:0},
  '~':{walk:false,kind:'water',h:0},
  '=':{walk:true,kind:'dock',h:0},
  'H':{walk:true,kind:'tavern',h:22,inside:true},
  'S':{walk:true,kind:'stables',h:18,inside:true},
  'T':{walk:true,kind:'temple',h:26,inside:true},
  'B':{walk:true,kind:'smith',h:20,inside:true},
  'C':{walk:true,kind:'cup',h:18,inside:true},
  'A':{walk:true,kind:'auction',h:22,inside:true},
  'v':{walk:true,kind:'grate',h:0},
  'E':{walk:true,kind:'exit',h:0},
  'U':{walk:true,kind:'up',h:0},
  'K':{walk:true,kind:'chest',h:0},
  'X':{walk:true,kind:'rat',h:0},
  'G':{walk:true,kind:'gate',h:0}
};
function parseMap(rows){return rows.map(r=>[...r])}

let G = {
  screen:'title', avatar:null, gold:80, pack:[],
  companion:{name:'Merrick',loyalty:45,hp:18,mhp:18},
  zone:'town', px:4, py:9, log:[],
  sewerLooted:{},
  partyHasMerrick:false
};
let rolled={str:10,dex:10,con:10,int:10,wis:10,cha:10};
let rollHistory=[];
let savedRoll=null;
let assignable=null;
let swapI=null;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  G.screen=id;
  if(id==='world'){ resizeWorld(); drawWorld(); renderSide(); }
  if(id==='combat'){ resizeGrid(); drawGrid(); renderCombatUI(); }
  if(id==='wmapscr'){ resizeWmap(); drawWmap(); }
}
function log(msg){
  G.log.unshift(msg);
  const el=document.getElementById('log');
  if(el) el.innerHTML=G.log.slice(0,40).map(x=>`<div>${x}</div>`).join('');
}
function hud(){
  const a=G.avatar;
  document.getElementById('hud').textContent=a
    ? `${a.name} · ${a.cls} L${a.level} · ${a.hp}/${a.mhp} · ${G.gold} gp · ${G.zone}`
    : '—';
}
function purse(){return `<div class="purse">Your purse: ${G.gold} gp</div>`}
function isPhone(){return window.matchMedia('(max-width:900px)').matches}
function toggleSheet(){document.getElementById('side').classList.toggle('open')}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* -------- chargen memory -------- */
function snapshotRoll(){return {rolled:{...rolled}, method:document.getElementById('cgMethod').value}}
function fillSelects(){
  document.getElementById('cgRace').innerHTML=Object.keys(RACES).map(x=>`<option>${x}</option>`).join('');
  document.getElementById('cgClass').innerHTML=Object.keys(CLASSES).map(x=>`<option>${x}</option>`).join('');
}
function rollStats(){
  rollHistory.push(snapshotRoll());
  if(rollHistory.length>30) rollHistory.shift();
  const m=document.getElementById('cgMethod').value;
  if(m==='V'){
    assignable=[fourDrop(),fourDrop(),fourDrop(),fourDrop(),fourDrop(),fourDrop()];
    ABILS.forEach((k,i)=>rolled[k]=assignable[i]);
  } else if(m==='I'){
    assignable=null; ABILS.forEach(k=>rolled[k]=nd(3,6));
  } else {
    assignable=null; ABILS.forEach(k=>rolled[k]=Math.max(nd(3,6),nd(3,6)));
  }
  refreshChargen();
}
function undoRoll(){
  if(!rollHistory.length){ document.getElementById('cgWarn').textContent='No previous roll.'; return; }
  const prev=rollHistory.pop();
  rolled={...prev.rolled};
  document.getElementById('cgMethod').value=prev.method;
  assignable = prev.method==='V' ? ABILS.map(k=>rolled[k]) : null;
  refreshChargen();
}
function saveRoll(){
  savedRoll=snapshotRoll();
  refreshChargen();
}
function loadSaved(){
  if(!savedRoll){ document.getElementById('cgWarn').textContent='Saved slot is empty.'; return; }
  rollHistory.push(snapshotRoll());
  rolled={...savedRoll.rolled};
  document.getElementById('cgMethod').value=savedRoll.method;
  assignable = savedRoll.method==='V' ? ABILS.map(k=>rolled[k]) : null;
  refreshChargen();
}
function effective(){
  const adj=RACES[document.getElementById('cgRace').value];
  const out={}; ABILS.forEach(k=>out[k]=Math.max(3,Math.min(19,rolled[k]+adj[k]))); return out;
}
function classOk(cls,st){return Object.entries(CLASSES[cls].mins).every(([k,v])=>st[k]>=v)}
function refreshChargen(){
  const race=document.getElementById('cgRace').value, cls=document.getElementById('cgClass').value;
  const st=effective(); const ban=RACES[race].ban||[];
  const ok=!ban.includes(cls)&&classOk(cls,st);
  const box=document.getElementById('cgStats');
  box.innerHTML=ABILS.map(k=>{
    const raw=rolled[k],eff=st[k];
    return `<span>${k.toUpperCase()}</span><span>${eff}</span><span class="hint">${raw!==eff?'('+raw+')':''}</span>`;
  }).join('');
  document.getElementById('cgWarn').textContent=ok?'Class requirements met.':
    (ban.includes(cls)?race+' cannot be '+cls+'.':'Scores miss '+cls+' minima.');
  document.getElementById('cgMem').textContent=
    `Saved slot: ${savedRoll?ABILS.map(k=>savedRoll.rolled[k]).join('/'):'empty'} · History: ${rollHistory.length}`;
  box.querySelectorAll('span:nth-child(3n+2)').forEach((el,i)=>{
    el.style.cursor=assignable?'pointer':'default';
    el.onclick=()=>swapStat(i);
  });
}
function swapStat(i){
  if(!assignable)return;
  if(swapI==null){swapI=i;return;}
  const a=ABILS[swapI],b=ABILS[i]; const t=rolled[a]; rolled[a]=rolled[b]; rolled[b]=t; swapI=null;
  refreshChargen();
}
function makeAvatar(name,race,cls,align,st){
  const mhp=CLASSES[cls].hd+Math.max(0,mod(st.con));
  const psp=cls==='Psionicist'?st.wis*2+st.con+2:0;
  return {name,race,cls,align,level:1,...st,hp:mhp,mhp,psp,mpsp:psp,ac:10+mod(st.dex),xp:0};
}
function confirmAvatar(){
  const race=document.getElementById('cgRace').value, cls=document.getElementById('cgClass').value;
  const st=effective();
  if((RACES[race].ban||[]).includes(cls)||!classOk(cls,st)){alert('Fix race/class or reroll.');return;}
  G.avatar=makeAvatar(document.getElementById('cgName').value||'Avatar',race,cls,document.getElementById('cgAlign').value,st);
  G.gold=40+nd(3,6)*10;
  G.pack=[rollItem('trash',2),{name:'Rations',slot:'junk',rarity:'Common',ilvl:1,shown:'Common Rations',id:true,val:1}];
  G.zone='town'; G.px=4; G.py=9;
  log('Morning fog on the Silent Bell. West and east gates leave town. The grate by the dock drops to the sewer.');
  hud(); show('world');
}
function quickStart(){
  fillSelects(); document.getElementById('cgMethod').value='V';
  rolled={str:16,dex:14,con:15,int:11,wis:13,cha:10};
  document.getElementById('cgRace').value='Human';
  document.getElementById('cgClass').value='Fighter';
  confirmAvatar();
}

/* -------- isometric draw -------- */
const TW=64, TH=32;
const view=document.getElementById('view');
const vctx=view.getContext('2d');
function curMap(){return G.zone==='sewer'?SEWER:TOWN}
function mapW(){return curMap()[0].length}
function mapH(){return curMap().length}
function cell(x,y){
  const m=curMap();
  if(y<0||x<0||y>=m.length||x>=m[0].length) return CH['#'];
  return CH[m[y][x]] || CH['.'];
}
function iso(x,y){ return {sx:(x-y)*(TW/2), sy:(x+y)*(TH/2)}; }
function resizeWorld(){ view.width=view.clientWidth; view.height=view.clientHeight; }

function diamond(ctx,x,y,w,h,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x,y-h/2); ctx.lineTo(x+w/2,y); ctx.lineTo(x,y+h/2); ctx.lineTo(x-w/2,y); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
}
function box3d(ctx,x,y,w,h,zh,top,left,right){
  // top diamond
  diamond(ctx,x,y-zh,w,h,top,'#00000040');
  ctx.beginPath();
  ctx.moveTo(x-w/2,y-zh); ctx.lineTo(x-w/2,y); ctx.lineTo(x,y+h/2); ctx.lineTo(x,y+h/2-zh); ctx.closePath();
  ctx.fillStyle=left; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+w/2,y-zh); ctx.lineTo(x+w/2,y); ctx.lineTo(x,y+h/2); ctx.lineTo(x,y+h/2-zh); ctx.closePath();
  ctx.fillStyle=right; ctx.fill();
}
function drawFigure(ctx,x,y,cloak,skin,isPlayer){
  ctx.fillStyle=cloak;
  ctx.beginPath(); ctx.moveTo(x-7,y-6); ctx.lineTo(x+8,y-4); ctx.lineTo(x+4,y+8); ctx.lineTo(x-6,y+8); ctx.fill();
  ctx.fillStyle='#2a2218';
  ctx.fillRect(x-4,y+6,3,6); ctx.fillRect(x+1,y+6,3,6);
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.arc(x,y-10,5,0,Math.PI*2); ctx.fill();
  if(isPlayer){
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y-10,6,0,Math.PI*2); ctx.stroke();
  }
}

function playerInside(){
  const c=cell(G.px,G.py);
  return !!(c.inside);
}
function drawWorld(){
  const ctx=vctx, W=view.width, Ht=view.height;
  ctx.fillStyle=G.zone==='sewer'?'#07080a':'#0b1612';
  ctx.fillRect(0,0,W,Ht);
  const origin=iso(G.px,G.py);
  const ox=W/2-origin.sx, oy=Ht/2-origin.sy+20;
  const m=curMap();
  const hideRoofs=playerInside();
  const t=performance.now()/800;

  const order=[];
  for(let y=0;y<m.length;y++) for(let x=0;x<m[0].length;x++) order.push({x,y,k:x+y});
  order.sort((a,b)=>a.k-b.k);

  for(const p of order){
    const c=cell(p.x,p.y);
    const pt=iso(p.x,p.y);
    const sx=ox+pt.sx, sy=oy+pt.sy;
    let top='#3a5a3a', left='#2a3a28', right='#1e2c1e';
    if(c.kind==='cobble'){ top='#6a6258'; left='#4a463e'; right='#3a362e'; }
    if(c.kind==='dock'){ top='#8a6a3a'; left='#6a4e28'; right='#5a3e20'; }
    if(c.kind==='dirt'){ top='#3a3428'; left='#2a241c'; right='#1e1a14'; }
    if(c.kind==='water'){
      const w=6+Math.sin(t+p.x*0.7+p.y)*4;
      top=`rgb(${20+w},${50+w},${70+w})`; left='#102838'; right='#0c1c28';
    }
    if(c.kind==='wall'){ top='#4a4038'; left='#2e2822'; right='#221c18'; }
    if(c.kind==='grate'||c.kind==='up'){ top='#2a2a28'; left='#1a1a18'; right='#121210'; }
    if(c.kind==='exit'){ top='#5a6a48'; left='#3a4a30'; right='#2a3a22'; }
    diamond(ctx,sx,sy,TW-2,TH-2,top,'#00000055');
    if(c.kind==='water'){
      ctx.strokeStyle='#8ad0e044'; ctx.beginPath();
      ctx.moveTo(sx-16,sy); ctx.quadraticCurveTo(sx,sy+4+Math.sin(t+p.x),sx+16,sy); ctx.stroke();
    }
    if(c.h>0 && !(hideRoofs && c.inside && Math.abs(p.x-G.px)+Math.abs(p.y-G.py)<4)){
      let roof='#6a3030';
      if(c.kind==='temple') roof='#c8c0a0';
      if(c.kind==='smith') roof='#4a4a50';
      if(c.kind==='cup') roof='#4a3060';
      if(c.kind==='auction') roof='#304060';
      if(c.kind==='stables') roof='#6a5030';
      if(c.kind==='tavern') roof='#7a2828';
      box3d(ctx,sx,sy,TW-6,TH-4,c.h,roof,shade(roof,-30),shade(roof,-50));
    }
    if(c.kind==='grate'){
      ctx.strokeStyle='#889'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx-10,sy); ctx.lineTo(sx+10,sy); ctx.moveTo(sx,sy-6); ctx.lineTo(sx,sy+6); ctx.stroke();
    }
    if(c.kind==='chest'){
      box3d(ctx,sx,sy-4,18,10,8,'#c9a227','#6a5018','#4a380e');
    }
    if(c.kind==='rat' && G.zone==='sewer' && !G.sewerLooted['rat'+p.x+','+p.y]){
      ctx.fillStyle='#6a5a48';
      ctx.beginPath(); ctx.ellipse(sx,sy-4,8,4,0,0,Math.PI*2); ctx.fill();
      ctx.fillRect(sx+6,sy-6,6,2);
    }
    if(c.kind==='exit'){
      ctx.fillStyle='#e8dcc0'; ctx.font='10px Georgia'; ctx.textAlign='center';
      ctx.fillText('ROAD',sx,sy-8);
    }
  }
  if(G.zone==='town'){
    NPCs.forEach(n=>{
      const pt=iso(n.x,n.y); drawFigure(ctx,ox+pt.sx,oy+pt.sy-8,n.cloak,n.skin,false);
    });
  }
  const ppt=iso(G.px,G.py);
  drawFigure(ctx,ox+ppt.sx,oy+ppt.sy-8,'#7a1c1c','#f0d0a8',true);
}

function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+d));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+d));
  const b=Math.max(0,Math.min(255,(n&255)+d));
  return `rgb(${r},${g},${b})`;
}

function tryMove(dx,dy){
  const nx=G.px+dx, ny=G.py+dy;
  const c=cell(nx,ny);
  if(!c.walk){ log('Blocked.'); return; }
  G.px=nx; G.py=ny;
  drawWorld();
  if(G.zone==='sewer' && c.kind==='rat' && !G.sewerLooted['rat'+nx+','+ny]){
    log('Rats boil out of the dark.');
    startCombat('sewer');
    G.sewerLooted['rat'+nx+','+ny]=true;
  }
  const n=NPCs.find(p=>p.x===nx&&p.y===ny);
  if(n && G.zone==='town') talk(n);
}

function padMove(dx,dy,e){
  if(e) e.preventDefault();
  if(e && e.type==='click' && padMove._touch){ padMove._touch=false; return; }
  if(e && e.type==='touchstart') padMove._touch=true;
  tryMove(dx,dy);
}

function interactHere(){
  const c=cell(G.px,G.py);
  if(c.kind==='grate' || (c.kind==='stables' && G.zone==='town')){
    openModal(`<h2>Sewer grate</h2><p>Iron bars over black water. The apprentice's trail goes down.</p>
      <button onclick="enterSewer()">Climb down</button>
      <button class="ghost" onclick="closeModal()">Stay</button>`);
    return;
  }
  if(c.kind==='up' && G.zone==='sewer'){
    G.zone='town'; G.px=10; G.py=9; closeModal(); log('You climb back to the dock grate.'); show('world'); return;
  }
  if(c.kind==='exit' || c.kind==='gate'){
    openWorldMap(); return;
  }
  if(c.kind==='chest' && G.zone==='sewer'){
    const key='c'+G.px+','+G.py;
    if(G.sewerLooted[key]){ log('Empty chest.'); return; }
    G.sewerLooted[key]=true;
    const it=rollItem('chest',2); G.pack.push(it);
    log('Chest: '+it.shown); renderSide(); return;
  }
  if(c.kind==='smith') openSmith();
  else if(c.kind==='cup') openCup();
  else if(c.kind==='auction') openAuction();
  else if(c.kind==='temple') openTemple();
  else if(c.kind==='tavern') log('Fire, stew, a room lute.');
  else if(c.kind==='stables'){
    log('Flies. The apprentice lies arranged. A grate in the floor.');
  } else {
    const n=NPCs.find(p=>Math.abs(p.x-G.px)+Math.abs(p.y-G.py)<=1);
    if(n && G.zone==='town') talk(n);
    else log(c.kind==='dock'?'Tide slaps the pilings.':'Nothing obvious.');
  }
}
function enterSewer(){
  closeModal();
  G.zone='sewer'; G.px=1; G.py=1;
  log('Cold stone. Drips. Something moves east.');
  show('world');
}

function talk(n){
  log('<b>'+n.name+':</b> '+n.line);
  if(n.id==='merrick'){
    openModal(`<h2>Merrick</h2>${purse()}<p>${n.line}</p>
      <button onclick="G.partyHasMerrick=true;log('Merrick falls in.');closeModal();renderSide();">Join party</button>
      <button class="ghost" onclick="closeModal()">Leave</button>`);
    return;
  }
  if(n.id==='holg'){openSmith();return;}
  if(n.id==='vena'){openCup();return;}
  if(n.id==='quire'){openAuction();return;}
  if(n.id==='sel'){openTemple();return;}
  openModal(`<h2>${n.name}</h2>${purse()}<p>${n.line}</p><button onclick="closeModal()">Close</button>`);
}

function renderSide(){
  const a=G.avatar; if(!a)return;
  document.getElementById('sheet').innerHTML=`
    <h2>${a.name}</h2>
    <div>${a.race} ${a.cls} · ${G.zone}</div>

function useItem(i){
  const it=G.pack[i]; if(!it)return;
  if(it.slot==='use' && /Mending/.test(it.name)){
    G.avatar.hp=Math.min(G.avatar.mhp,G.avatar.hp+8); G.pack.splice(i,1); log('Flesh knits.');
  } else if(/Identify/.test(it.name)||/Identify/.test(it.shown)){
    const u=G.pack.find(x=>!x.id);
    if(!u){log('Nothing unidentified.');return;}
    u.id=true; u.shown=u.rarity+' '+u.name; G.pack.splice(i,1); log('Named: '+u.shown);
  } else log(it.shown);
  renderSide();
}
function vendorPrice(it){
  const m={Common:1,Uncommon:1.15,Rare:1.35,Epic:1.6,Legendary:2}[it.rarity]||1;
  return Math.max(2,Math.round(it.val*m*0.65));
}
function openSmith(){
  openModal(`<h2>Holg Smith</h2>${purse()}
    <button onclick="smithDo('repair')">Repair — 5 gp</button>
    <button onclick="smithDo('forge')">Forge +1 ilvl — 15 gp</button>
    <button onclick="smithDo('mw')">Masterwork +1 — 40 gp</button>
    <button onclick="smithDo('buy')">Buy stock blade</button>
    <button class="ghost" onclick="closeModal()">Leave</button>`);
}
function smithDo(kind){
  if(kind==='repair'){G.gold=Math.max(0,G.gold-5);log('Oiled.');closeModal();}
  if(kind==='forge' && G.gold>=15){
    const it=G.pack.find(x=>x.slot==='weapon'||x.slot==='armor');
    if(it){it.ilvl=Math.min(it.ilvl+1,4);G.gold-=15;log('Forged to ilvl '+it.ilvl);}
    closeModal();
  }
  if(kind==='mw' && G.gold>=40){
    const it=G.pack.find(x=>x.rarity!=='Common');
    if(it){it.mw=(it.mw||0)+1;it.dmg=(it.dmg||0)+1;G.gold-=40;log('Masterwork '+it.mw);}
    closeModal();
  }
  if(kind==='buy'){
    const it=rollItem('vendor',3); const p=vendorPrice(it); window._stock=it;
    openModal(`<h2>Holg shrugs</h2>${purse()}<p class="${RARITY_CLASS[it.rarity]}">${it.shown}</p><p>${p} gp</p>
      <button onclick="if(G.gold>=${p}){G.gold-=${p};G.pack.push(window._stock);log('Bought '+window._stock.shown);}else log('No coin.');closeModal();renderSide();">Buy</button>
      <button class="ghost" onclick="closeModal()">No</button>`);
  }
  renderSide();
}
function openCup(){
  const stake=24;
  openModal(`<h2>The Cup</h2>${purse()}<p>${stake} gp. Fence weights. No pity.</p>
    ${G.gold<stake?'<p>Not enough coin.</p>':`<button onclick="doCup(${stake})">Drop coin</button>`}
    <button class="ghost" onclick="closeModal()">Walk away</button>`);
}
function doCup(stake){
  G.gold-=stake; const it=rollItem('fence',3); it.id=true; it.shown=it.rarity+' '+it.name;
  G.pack.push(it); log('Cup: '+it.shown); closeModal(); renderSide();
}
function openAuction(){
  const listings=[rollItem('vendor',3),rollItem('fence',3),rollItem('chest',3)];
  listings.forEach(it=>{it.id=it.rarity==='Common'||it.rarity==='Uncommon'; it.shown=it.id?it.rarity+' '+it.name:'Unidentified item';});
  window._ah=listings;
  openModal(`<h2>Auction hall</h2>${purse()}`+
    listings.map((it,i)=>`<button onclick="buyAh(${i})">${it.shown} — ${Math.round(vendorPrice(it)*1.5)} gp</button>`).join('')+
    `<button class="ghost" onclick="closeModal()">Leave</button>`);
}
function buyAh(i){
  const it=window._ah[i]; const p=Math.round(vendorPrice(it)*1.5);
  if(G.gold>=p){G.gold-=p;G.pack.push(it);log('Hall: '+it.shown);} else log('No coin.');
  closeModal(); renderSide();
}
function openTemple(){
  const fee=50*G.avatar.level*G.avatar.level;
  openModal(`<h2>Temple of the Bell</h2>${purse()}
    <p>Respec the rolled six for ${fee} gp (rotates scores). Cannot reroll dice.</p>
    <button onclick="doRespec(${fee})">Pay</button>
    <button class="ghost" onclick="closeModal()">Leave</button>`);
}
function doRespec(fee){
  if(G.gold<fee){log('The acolyte waits.');closeModal();return;}
  const vals=ABILS.map(k=>G.avatar[k]); const rot=vals.slice(1).concat(vals[0]);
  ABILS.forEach((k,i)=>G.avatar[k]=rot[i]); G.gold-=fee; log('The Bell accepts a rotation.');
  closeModal(); renderSide();
}

const REGIONS=[
  {id:'harbor',name:'Harbor of the Silent Bell',x:0.45,y:0.55,go:returnHarbor},
  {id:'road',name:'West Road',x:0.22,y:0.48},
  {id:'marsh',name:'Reedmarsh',x:0.62,y:0.70},
  {id:'hills',name:'Bell Hills',x:0.70,y:0.32},
  {id:'wood',name:'Ashwood',x:0.30,y:0.28}
];
function openWorldMap(){ closeModal(); show('wmapscr'); }
function returnHarbor(){ G.zone='town'; G.px=1; G.py=1; log('The road returns you to the east/west gate.'); show('world'); }
function resizeWmap(){ const c=document.getElementById('wmap'); c.width=c.clientWidth; c.height=c.clientHeight; }
function drawWmap(){
  const c=document.getElementById('wmap'), ctx=c.getContext('2d');
  ctx.fillStyle='#102018'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#3a5a40';
  for(let i=0;i<8;i++){ ctx.beginPath(); ctx.moveTo(0,c.height*(i/8)); ctx.lineTo(c.width,c.height*((i+1)/8)); ctx.stroke(); }
  REGIONS.forEach(r=>{
    const x=r.x*c.width, y=r.y*c.height;
    diamond(ctx,x,y,48,24,r.id==='harbor'?'#c9a227':'#4a6a48','#000');

document.getElementById('wmap').addEventListener('click',e=>{
  const c=e.target, x=e.offsetX/c.width, y=e.offsetY/c.height;
  let best=null,bd=9;
  REGIONS.forEach(r=>{const d=Math.hypot(r.x-x,r.y-y); if(d<bd){bd=d;best=r;}});
  if(!best||bd>0.12)return;
  if(best.id==='harbor') returnHarbor();
  else { log('The '+best.name+' is plotted. Slice: road dust, no map tile yet. Returning.'); returnHarbor(); }
});

/* combat (unchanged loop, iso-looking grid cells) */
const grid=document.getElementById('grid'); const gctx=grid.getContext('2d');
let combat=null;
function resizeGrid(){ grid.width=grid.clientWidth||innerWidth; grid.height=grid.clientHeight||innerHeight-160; }
function startCombat(where){
  const enemies=where==='sewer'?[
    makeFoe('Sewer Rat',1,8,2,'trash'), makeFoe('Sewer Rat',1,8,2,'trash'), makeFoe('Fat Rat',2,16,4,'elite')
  ]:[makeFoe('Brigand',2,14,4,'standard')];
  const units=[];
  const av=G.avatar;
  units.push({id:'player',name:av.name,side:'pc',hp:av.hp,mhp:av.mhp,ac:av.ac,str:av.str,dex:av.dex,con:av.con,int:av.int,wis:av.wis,cls:av.cls,
    placeInit:d(20)+mod(av.wis)+mod(av.int),atkInit:d(20)+mod(av.dex),x:null,y:null,
    stealth:['Thief','Assassin','Psionicist','Mage'].includes(av.cls)});
  if(G.partyHasMerrick) units.push({id:'merrick',name:'Merrick',side:'pc',hp:G.companion.hp,mhp:G.companion.mhp,ac:14,str:15,dex:12,con:14,int:9,wis:11,cls:'Fighter',
    placeInit:d(20)+1,atkInit:d(20)+1,x:null,y:null,stealth:false});
  enemies.forEach(e=>units.push(e));
  combat={phase:'place',units,orderPlace:[...units].sort((a,b)=>b.placeInit-a.placeInit),placeIdx:0,log:[]};
  units.forEach(u=>clog(u.name+' place-init '+u.placeInit));
  show('combat'); autoPlaceIfNeeded();
}
function makeFoe(name,ilvl,hp,dmg,threat){
  return {id:'e'+Math.random().toString(36).slice(2,6),name,side:'en',hp,mhp:hp,ac:11+ilvl,str:10+ilvl,dex:12,con:10,int:6,wis:8,cls:'Beast',
    placeInit:d(20),atkInit:d(20)+1,x:null,y:null,stealth:false,ilvl,dmg,threat};
}
function clog(s){combat.log.unshift(s);renderCombatUI();}
const GW=10,GH=8,CONTACT=4;
function cellSize(){return Math.min((grid.width-20)/GW,(grid.height-20)/GH)}
function drawGrid(){
  const ctx=gctx,s=cellSize();
  ctx.fillStyle='#12110c'; ctx.fillRect(0,0,grid.width,grid.height);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const px=10+x*s+s/2, py=10+y*s+s/2;
    diamond(ctx,px,py,s-4,s/2,x<CONTACT?'#2a4030':(x===CONTACT?'#4a3a20':'#3a2824'),'#0006');
  }
  if(!combat)return;
  combat.units.forEach(u=>{
    if(u.x==null)return;
    const px=10+u.x*s+s/2, py=10+u.y*s+s/2-8;
    drawFigure(ctx,px,py,u.side==='pc'?'#7a1c1c':'#4a3a30', u.hp<=0?'#666':'#e8c8a0', u.id==='player');
  });
}
function occ(x,y){return combat.units.find(u=>u.x===x&&u.y===y&&u.hp>0)}
function currentPlacer(){return combat.orderPlace[combat.placeIdx]}
function autoPlaceIfNeeded(){
  const u=currentPlacer();
  if(!u){beginAttackPhase();return;}
  if(u.side==='en'){
    const minX=u.stealth?0:CONTACT;
    for(let t=0;t<40;t++){const x=minX+Math.floor(Math.random()*(GW-minX)),y=Math.floor(Math.random()*GH);
      if(!occ(x,y)){u.x=x;u.y=y;break;}}
    clog(u.name+' takes a cell.'); combat.placeIdx++; drawGrid(); renderCombatUI();
    setTimeout(autoPlaceIfNeeded,240);
  } else { clog('Place '+u.name+' on the left half. Stealth may try the right.'); drawGrid(); renderCombatUI(); }
}
function clickGrid(ev){
  if(!combat)return;
  if(combat.phase==='fight'){clickFight(ev);return;}
  if(combat.phase!=='place')return;
  const u=currentPlacer(); if(!u||u.side!=='pc')return;
  const s=cellSize(); const x=Math.floor((ev.offsetX-10)/s), y=Math.floor((ev.offsetY-10)/s);
  if(x<0||y<0||x>=GW||y>=GH||occ(x,y))return;
  if(x>=CONTACT){
    if(!u.stealth){clog('Only stealth/invis behind the line.');return;}
    const det=10+d(20), pl=d(20)+mod(u.dex)-(x-CONTACT+1)*2-3;
    if(pl>=det){u.x=x;u.y=y;clog(u.name+' holds the rear.');}
    else {u.x=CONTACT-1;u.y=y;clog('Detected. Snapped back.');}
  } else {u.x=x;u.y=y;}
  combat.placeIdx++; drawGrid(); autoPlaceIfNeeded();
}
function beginAttackPhase(){
  combat.phase='fight';
  combat.orderAtk=combat.units.filter(u=>u.hp>0).sort((a,b)=>b.atkInit-a.atkInit);
  combat.atkIdx=0; nextAct();
}
function actor(){return combat.orderAtk[combat.atkIdx]}
function nextAct(){
  if(!combat.units.some(u=>u.side==='en'&&u.hp>0)){victory();return;}
  if(!combat.units.some(u=>u.side==='pc'&&u.hp>0)){defeat();return;}
  while(combat.atkIdx<combat.orderAtk.length && actor().hp<=0) combat.atkIdx++;
  if(combat.atkIdx>=combat.orderAtk.length){
    combat.orderAtk=combat.units.filter(u=>u.hp>0).sort((a,b)=>b.atkInit-a.atkInit);
    combat.atkIdx=0; clog('— new round —');
  }
  const u=actor();
  if(u.side==='en') setTimeout(()=>aiAct(u),300);
  else { clog(u.name+' — click enemy in reach or empty cell to move.'); combat.waiting=u; }
  drawGrid(); renderCombatUI();
}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function clickFight(ev){
  const u=combat.waiting; if(!u)return;
  const s=cellSize(); const x=Math.floor((ev.offsetX-10)/s), y=Math.floor((ev.offsetY-10)/s);
  const foe=occ(x,y);
  if(foe&&foe.side!==u.side){
    if(dist(u,foe)>1&&u.cls!=='Mage'&&u.cls!=='Psionicist'){clog('Too far.');return;}
    strike(u,foe); combat.waiting=null; combat.atkIdx++; nextAct(); return;
  }
  if(!occ(x,y)&&Math.abs(u.x-x)+Math.abs(u.y-y)<=Math.max(3,4+Math.floor(((u.dex||10)+(u.con||10))/4))){
    u.x=x;u.y=y;clog(u.name+' moves.'); drawGrid();
  }
}
function strike(a,b){
  const roll=d(20)+mod(a.str||10);
  if(roll<b.ac-4){clog(a.name+' misses '+b.name);return;}
  const dmg=Math.max(1,d(6)+mod(a.str||10)+(a.dmg||0));
  b.hp-=dmg; clog(a.name+' hits '+b.name+' for '+dmg);
  if(b.hp<=0){clog(b.name+' falls.'); if(b.side==='en') dropFrom(b);}
}
function aiAct(u){
  const foes=combat.units.filter(t=>t.side==='pc'&&t.hp>0).sort((p,q)=>dist(u,p)-dist(u,q));
  const t=foes[0]; if(!t){combat.atkIdx++;nextAct();return;}
  if(dist(u,t)>1){
    const nx=u.x+Math.sign(t.x-u.x), ny=u.y;
    if(!occ(nx,ny)&&nx>=0&&nx<GW) u.x=nx;
    if(dist(u,t)>1){clog(u.name+' skitters.');combat.atkIdx++;nextAct();return;}
  }
  strike(u,t); if(t.id==='player') G.avatar.hp=t.hp;
  combat.atkIdx++; nextAct();
}
function dropFrom(foe){
  const n=foe.threat==='elite'?1+d(2):1;
  for(let i=0;i<n;i++){const it=rollItem(foe.threat||'trash',foe.ilvl||1); G.pack.push(it); clog('Loot: '+it.shown); log('Loot: '+it.shown);}
}
function victory(){ G.avatar.hp=combat.units.find(u=>u.id==='player').hp; G.avatar.xp+=40;
  if(G.avatar.xp>=100){G.avatar.level=Math.min(30,G.avatar.level+1);G.avatar.xp=0;G.avatar.mhp+=d(CLASSES[G.avatar.cls].hd);G.avatar.hp=G.avatar.mhp;log('Level '+G.avatar.level);}
  combat.phase='done'; clog('Last rat stills.'); renderCombatUI(); }
function defeat(){ G.avatar.hp=1; combat.phase='done'; clog('You crawl out.'); renderCombatUI(); }
function renderCombatUI(){
  const box=document.querySelector('#combat #combatUI');
  if(!box||!combat){if(box)box.innerHTML='';return;}
  const u=combat.phase==='place'?currentPlacer():actor();
  box.innerHTML=`<div><b>${combat.phase}</b> ${u?('· '+u.name):''}
    <button onclick="show('world');hud();renderSide();">Leave field</button></div>
    <div class="hint">${(combat.log||[]).slice(0,5).join(' · ')}</div>`;
}

grid.addEventListener('click',clickGrid);
window.addEventListener('keydown',e=>{
  if(G.screen!=='world')return;
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w')tryMove(0,-1);
  if(k==='arrowdown'||k==='s')tryMove(0,1);
  if(k==='arrowleft'||k==='a')tryMove(-1,0);
  if(k==='arrowright'||k==='d')tryMove(1,0);
  if(k==='e'||k===' ')interactHere();
  if(k==='m')openWorldMap();
});
(function(){
  let x0=0,y0=0;
  view.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY;}},{passive:true});
  view.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;
    if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0); else tryMove(0,dy>0?1:-1);
  },{passive:true});
})();
window.addEventListener('resize',()=>{ if(G.screen==='world'){resizeWorld();drawWorld();} if(G.screen==='combat'){resizeGrid();drawGrid();} if(G.screen==='wmapscr'){resizeWmap();drawWmap();} });
document.addEventListener('gesturestart',e=>e.preventDefault());
fillSelects(); rollStats();
setInterval(()=>{ if(G.screen==='world') drawWorld(); },180);
</script>
</body>
