<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0d0b09" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-title" content="Silent Bell" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Harbor of the Silent Bell</title>
<style>
  :root {
    --ink: #e8dcc0;
    --dim: #9a8b6e;
    --bg: #0d0b09;
    --panel: #1a1510;
    --iron: #3a3228;
    --gold: #c9a227;
    --blood: #8b2a2a;
    --ok: #6b8f4e;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body { min-height: 100dvh; }
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; height: 100svh;
    padding-top: var(--safe-t);
    padding-bottom: var(--safe-b);
    padding-left: var(--safe-l);
    padding-right: var(--safe-r);
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; background: #120f0c; border-bottom: 1px solid var(--iron);
    font-size: 14px; letter-spacing: .04em;
    flex-shrink: 0;
  }
  header b { color: var(--gold); font-weight: 600; }
  #screens { flex: 1; position: relative; overflow: hidden; }
  .screen { display: none; position: absolute; inset: 0; }
  .screen.active { display: flex; flex-direction: column; }
  .center { align-items: center; justify-content: center; text-align: center; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; color: var(--gold); }
  h2 { font-size: 18px; color: var(--gold); margin: 0 0 12px; }
  p.lead { max-width: 520px; color: var(--dim); }
  button, select {
    background: #2a221a; color: var(--ink); border: 1px solid var(--gold);
    padding: 8px 14px; font-family: inherit; cursor: pointer; margin: 4px;
    min-height: 44px; font-size: 16px;
  }
  button:hover { background: #3a3126; }
  button.ghost { border-color: var(--iron); color: var(--dim); }
  input[type=text] {
    background: #120f0c; color: var(--ink); border: 1px solid var(--iron);
    padding: 8px 10px; font-family: inherit; width: 220px;
    min-height: 44px; font-size: 16px; max-width: 100%;
  }
  select { max-width: 100%; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: var(--panel); border: 1px solid var(--iron); padding: 14px;
    min-width: 200px; text-align: left;
  }
  .stats { display: grid; grid-template-columns: 70px 40px 28px; gap: 4px 8px; }
  .gold { color: var(--gold); }
  .rare { color: #6ea8d8; }
  .epic { color: #b07ad6; }
  .legendary { color: #d4a017; }
  .artifact { color: #c44; }
  #worldWrap { flex: 1; display: flex; min-height: 0; }
  canvas#view { flex: 1; background: #152018; display: block; }
  #side {
    width: 280px; background: #120f0c; border-left: 1px solid var(--iron);
    padding: 10px; overflow: auto; font-size: 13px;
  }
  #log {
    height: 140px; overflow: auto; background: #0a0806; padding: 8px;
    border-top: 1px solid var(--iron); font-size: 12px; color: var(--dim);
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
  }
  .log-item { margin: 0 0 4px; }
  #combatUI { padding: 8px 12px; background: #120f0c; border-top: 1px solid var(--iron); flex-shrink: 0; }
  canvas#view, canvas#grid { touch-action: none; }
  #pad {
    display: none;
    flex-shrink: 0;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px 10px;
    background: #120f0c;
    border-top: 1px solid var(--iron);
  }
  .dpad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 4px;
  }
  .dpad button {
    margin: 0; min-height: 56px; min-width: 56px; padding: 0;
    font-size: 20px; user-select: none;
  }
  .dpad .n { grid-column: 2; grid-row: 1; }
  .dpad .w { grid-column: 1; grid-row: 2; }
  .dpad .e { grid-column: 3; grid-row: 2; }
  .dpad .s { grid-column: 2; grid-row: 3; }
  #actBtns { display: flex; flex-direction: column; gap: 8px; }
  #actBtns button { min-width: 112px; margin: 0; }
  #sheetToggle { display: none; }

  @media (max-width: 900px) {
    header { font-size: 12px; }
    header span:first-child { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #hud { font-size: 11px; text-align: right; }
    h1 { font-size: 22px; }
    .card { min-width: 0; width: 100%; }
    #worldWrap { flex-direction: column; }
    #side {
      display: none;
      position: absolute; left: 0; right: 0; bottom: 0;
      width: 100%; height: min(52vh, 420px);
      border-left: 0; border-top: 1px solid var(--gold);
      z-index: 5;
    }
    #side.open { display: block; }
    #log { height: 72px; }
    #pad { display: flex; }
    #sheetToggle { display: inline-block; }
    .center { padding: 16px; }
  }
  @media (max-width: 900px) and (orientation: landscape) {
    #pad { padding: 4px 10px; }
    .dpad { grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px 44px; }
    .dpad button { min-height: 44px; min-width: 44px; }
    #log { height: 48px; }
  }
  .hp { height: 8px; background: #2a1515; margin: 4px 0 8px; }
  .hp > i { display: block; height: 100%; background: var(--blood); }
  table.items { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.items td { padding: 3px 4px; border-bottom: 1px solid #2a221a; }
  .hint { color: var(--dim); font-size: 12px; }
  #modal {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.72); align-items: flex-end; justify-content: center;
    padding: 12px; padding-bottom: calc(12px + var(--safe-b));
  }
  #modal.open { display: flex; }
  #modal .sheet {
    background: var(--panel); border: 1px solid var(--gold);
    width: min(520px, 100%); max-height: 78dvh; overflow: auto;
    padding: 16px; -webkit-overflow-scrolling: touch;
  }
  #modal .sheet button { width: 100%; margin: 6px 0; }
  #modal h2 { margin-top: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span><b>Harbor of the Silent Bell</b> · slice</span>
    <span id="hud">—</span>
  </header>
  <div id="screens">
    <section id="title" class="screen center active">
      <h1>Harbor of the Silent Bell</h1>
      <p class="lead">A 24-bit living-world slice. Roll an Avatar. Walk the dock. The stables are not quiet.</p>
      <div>
        <button onclick="show('chargen')">Create Avatar</button>
        <button class="ghost" onclick="quickStart()">Quick start (Method V)</button>
      </div>
    </section>

    <section id="chargen" class="screen" style="padding:16px;overflow:auto">
      <h2>Create the Avatar</h2>
      <div class="row">
        <div class="card">
          <label>Name<br><input id="cgName" type="text" value="Aric" /></label>
          <p>Race</p>
          <select id="cgRace" onchange="refreshChargen()"></select>
          <p>Class</p>
          <select id="cgClass" onchange="refreshChargen()"></select>
          <p>Alignment</p>
          <select id="cgAlign">
            <option>Lawful Good</option><option>Neutral Good</option><option>Chaotic Good</option>
            <option selected>Lawful Neutral</option><option>True Neutral</option><option>Chaotic Neutral</option>
            <option>Lawful Evil</option><option>Neutral Evil</option><option>Chaotic Evil</option>
          </select>
          <p>Roll method</p>
          <select id="cgMethod" onchange="rollStats()">
            <option value="V" selected>Method V — 4d6 drop lowest, assign</option>
            <option value="I">Method I — 3d6 in order</option>
            <option value="II">Method II — 3d6 twice, keep high, in order</option>
          </select>
        </div>
        <div class="card">
          <div class="stats" id="cgStats"></div>
          <p class="hint" id="cgWarn"></p>
          <button onclick="rollStats()">Reroll set</button>
          <button onclick="confirmAvatar()">Enter the harbor</button>
        </div>
      </div>
    </section>

    <section id="world" class="screen">
      <div id="worldWrap">
        <canvas id="view"></canvas>
        <aside id="side">
          <div id="sheet"></div>
          <hr style="border-color:var(--iron)">
          <div id="inv"></div>
        </aside>
      </div>
      <div id="log"></div>
      <div id="pad">
        <div class="dpad">
          <button class="n" type="button" ontouchstart="padMove(0,-1,event)" onclick="padMove(0,-1,event)">▲</button>
          <button class="w" type="button" ontouchstart="padMove(-1,0,event)" onclick="padMove(-1,0,event)">◄</button>
          <button class="e" type="button" ontouchstart="padMove(1,0,event)" onclick="padMove(1,0,event)">►</button>
          <button class="s" type="button" ontouchstart="padMove(0,1,event)" onclick="padMove(0,1,event)">▼</button>
        </div>
        <div id="actBtns">
          <button type="button" onclick="interactHere()">Use / Talk</button>
          <button type="button" id="sheetToggle" class="ghost" onclick="toggleSheet()">Sheet / Pack</button>
        </div>
      </div>
    </section>

    <section id="combat" class="screen">
      <canvas id="grid" style="flex:1;background:#1a1a16;display:block"></canvas>
      <div id="combatUI"></div>
    </section>
  </div>
</div>
<div id="modal"><div class="sheet" id="modalBody"></div></div>

<script>
const RACES = {
  Human:    {str:0,dex:0,con:0,int:0,wis:0,cha:0, any:true},
  Elf:      {str:0,dex:1,con:-1,int:0,wis:0,cha:0, ban:['Paladin']},
  Dwarf:    {str:0,dex:0,con:1,int:0,wis:0,cha:-1, ban:['Paladin','Mage','Druid','Bard','Illusionist']},
  Halfling: {str:-1,dex:1,con:0,int:0,wis:0,cha:0, ban:['Paladin','Mage','Ranger','Cavalier']},
  Gnome:    {str:0,dex:0,con:0,int:1,wis:-1,cha:0, ban:['Paladin','Ranger','Cavalier']},
  'Half-Elf':{str:0,dex:0,con:0,int:0,wis:0,cha:0, ban:['Paladin']}
};
const CLASSES = {
  Fighter:      {mins:{str:9}, hd:10},
  Paladin:      {mins:{str:12,dex:8,con:9,int:9,wis:13,cha:17}, hd:10},
  Ranger:       {mins:{str:13,dex:13,con:14,wis:14}, hd:10},
  Barbarian:    {mins:{str:15,con:14,dex:14}, hd:12},
  Cavalier:     {mins:{str:15,dex:15,con:15,int:10,wis:10,cha:15}, hd:10},
  Mage:         {mins:{int:9}, hd:4},
  Illusionist:  {mins:{dex:16,int:9}, hd:4},
  Necromancer:  {mins:{int:9,wis:9}, hd:4},
  Cleric:       {mins:{wis:9}, hd:8},
  Druid:        {mins:{wis:12,cha:15}, hd:8},
  Thief:        {mins:{dex:9}, hd:6},
  Assassin:     {mins:{str:12,dex:12,int:11}, hd:6},
  Bard:         {mins:{dex:12,int:13,cha:15}, hd:6},
  Monk:         {mins:{str:15,dex:15,con:11,wis:15}, hd:8},
  Psionicist:   {mins:{con:11,int:12,wis:15}, hd:6}
};
const ABILS = ['str','dex','con','int','wis','cha'];
const RARITY = ['Common','Uncommon','Rare','Epic','Legendary'];
const RARITY_CLASS = {Common:'', Uncommon:'gold', Rare:'rare', Epic:'epic', Legendary:'legendary'};

const WEIGHTS = {
  trash:     [78, 18, 3.50, 0.45, 0.05],
  standard:  [62, 28, 8, 1.70, 0.30],
  elite:     [40, 35, 18, 6, 1],
  champion:  [25, 35, 27, 10, 3],
  boss:      [10, 25, 35, 20, 10],
  chest:     [80, 16, 3.2, 0.70, 0.10],
  vendor:    [70, 20, 8, 1.5, 0.15],
  fence:     [55, 22, 18, 5, 0.80]
};

const BASES = [
  ['Rusty Dagger','weapon',4],['Short Sword','weapon',8],['Long Sword','weapon',12],
  ['Battle Axe','weapon',14],['Warhammer','weapon',10],['Staff','weapon',6],
  ['Hunting Bow','weapon',9],['Leather Jerkin','armor',6],['Mail Shirt','armor',12],
  ['Steel Helm','armor',8],['Kite Shield','armor',7],['Wool Cloak','armor',3],
  ['Copper Ring','ring',5],['Silver Amulet','ring',8],['Potion of Mending','use',15],
  ['Identify Scroll','use',20],['Bag of Nails','junk',1],['Loaf','junk',1],
  ['Psionic Crystal','use',18],['Spellbook Fragment','use',16]
];
const AFFIX = [
  ['Keen', {hit:1}], ['Brutal', {dmg:2}], ['Stalwart', {ac:1}],
  ['Quick', {dex:1}], ['Sage', {int:1}], ['Hallowed', {wis:1}],
  ['of Wounding', {dmg:1}], ['of Defense', {ac:2}], ['of the Fox', {dex:1}],
  ['Flame Tongue', {dmg:3, fire:true}], ['Spell Storing', {psp:4}]
];

function d(n){ return 1 + Math.floor(Math.random()*n); }
function nd(n,s){ let t=0; for(let i=0;i<n;i++) t+=d(s); return t; }
function fourDrop(){ const a=[d(6),d(6),d(6),d(6)].sort((x,y)=>x-y); return a[1]+a[2]+a[3]; }
function mod(s){
  if(s<=3) return -3; if(s<=5) return -2; if(s<=8) return -1;
  if(s<=12) return 0; if(s<=15) return 1; if(s<=17) return 2; return 3;
}
function pickWeight(row){
  const r = Math.random()*100;
  let acc=0;
  for(let i=0;i<row.length;i++){ acc+=row[i]; if(r<=acc) return RARITY[i]; }
  return 'Common';
}
function rollItem(threat, ilvl){
  const rare = pickWeight(WEIGHTS[threat] || WEIGHTS.trash);
  const base = BASES[Math.floor(Math.random()*BASES.length)];
  const item = { name: base[0], slot: base[1], ilvl, rarity: rare, val: base[2]*ilvl, hit:0, dmg:0, ac:0, id: rare==='Common'||rare==='Uncommon' };
  if(rare!=='Common'){
    const n = rare==='Uncommon'?1: rare==='Rare'?2: rare==='Epic'?3:4;
    for(let i=0;i<n;i++){
      const a = AFFIX[Math.floor(Math.random()*AFFIX.length)];
      item.name = i===0 ? a[0]+' '+item.name : item.name+' '+a[0];
      Object.assign(item, Object.fromEntries(Object.entries(a[1]).map(([k,v])=>[k,(item[k]||0)+v])));
    }
  }
  if(!item.id) item.shown = 'Unidentified '+base[0];
  else item.shown = item.rarity+' '+item.name;
  return item;
}

const TILE = {
  0:{ch:'.', c:'#2d4a32', walk:true, name:'grass'},
  1:{ch:'#', c:'#6a5a48', walk:true, name:'cobble'},
  2:{ch:'~', c:'#1b3a55', walk:false, name:'water'},
  3:{ch:'H', c:'#5a4030', walk:true, name:'wood', enter:'tavern'},
  4:{ch:'S', c:'#4a3828', walk:true, name:'stables', enter:'stables'},
  5:{ch:'T', c:'#4a4a3a', walk:true, name:'temple', enter:'temple'},
  6:{ch:'B', c:'#3a3a3a', walk:true, name:'smith', enter:'smith'},
  7:{ch:'C', c:'#3a3040', walk:true, name:'cup', enter:'cup'},
  8:{ch:'A', c:'#303848', walk:true, name:'hall', enter:'auction'},
  9:{ch:'v', c:'#243020', walk:true, name:'sewer', enter:'sewer'},
 10:{ch:'=', c:'#8a7a50', walk:true, name:'dock'},
 11:{ch:'W', c:'#3a3028', walk:false, name:'wall'}
};

/* 32 x 20 harbor */
const MAP = [
"22222222222222222222222222222222",
"22222222222222222222222222222222",
"1111111111AAAAAAAAAA111111111111",
"1..........1111111111.........91",
"1.3333.....1111111111..6666....1",
"1.3333.....1......... ..6666....1",
"1..........1..5555... ..........1",
"1.4444.....1..5555..............1",
"1.4444..........................1",
"1..............11111.....7777...1",
"1..............11111.....7777...1",
"1....111111111111111111111111...1",
"1..............................1",
"10101010101010101010101010101011",
"10101010101010101010101010101011",
"22222222222222222222222222222222",
"22222222222222222222222222222222",
"22222222222222222222222222222222",
"22222222222222222222222222222222",
"22222222222222222222222222222222"
].map(r => r.replace(/ /g,''));

/* fix map - I used spaces accidentally. Rebuild clean map */
const RAW = [
"################################",
"#..............AAAAAAAA........#",
"#..TTTT........AAAAAAAA........#",
"#..TTTT........................#",
"#.................SSSS.........#",
"#..HHHH...........SSSS.........#",
"#..HHHH........................#",
"#..............BBBB............#",
"#..............BBBB.....CCCC...#",
"#.......................CCCC...#",
"#.........=======..............#",
"#.........=======.........v....#",
"#~~~~.....=======..............#",
"~~~~~~....=======.....~~~~.....#",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~#",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~",
"################################"
];
const CH2T = {'.':0,'#':11,'~':2,'=':10,'H':3,'S':4,'T':5,'B':6,'C':7,'A':8,'v':9};
const W = RAW[0].length, H = RAW.length;
const worldMap = RAW.map(row => [...row].map(ch => CH2T[ch] ?? 0));

let G = {
  screen:'title',
  avatar:null,
  gold:80,
  pack:[],
  recipes: new Set(),
  companion: {name:'Merrick', loyalty:45, cls:'Fighter', hp:18, mhp:18},
  px: 8, py: 11,
  log: []
};

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  G.screen = id;
  if(id==='world'){ resizeWorld(); drawWorld(); renderSide(); }
  if(id==='combat'){ resizeGrid(); drawGrid(); renderCombatUI(); }
}
function log(msg){
  G.log.unshift(msg);
  const el = document.getElementById('log');
  if(el) el.innerHTML = G.log.slice(0,40).map(x=>`<div class="log-item">${x}</div>`).join('');
}
function isPhone(){ return window.matchMedia('(max-width:900px)').matches; }
function toggleSheet(){
  document.getElementById('side').classList.toggle('open');
}
function padMove(dx,dy,e){
  if(e){ e.preventDefault(); }
  if(e && e.type==='click' && padMove._touch){ padMove._touch=false; return; }
  if(e && e.type==='touchstart') padMove._touch=true;
  tryMove(dx,dy);
}
function openModal(html){
  const m = document.getElementById('modal');
  document.getElementById('modalBody').innerHTML = html;
  m.classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id==='modal') closeModal();
});
function hud(){
  const a = G.avatar;
  document.getElementById('hud').textContent = a
    ? `${a.name}  ${a.race} ${a.cls}  L${a.level}  HP ${a.hp}/${a.mhp}  ${G.gold} gp`
    : '—';
}

/* -------- chargen -------- */
let rolled = {str:10,dex:10,con:10,int:10,wis:10,cha:10};
let assignable = null;

function fillSelects(){
  const r = document.getElementById('cgRace');
  r.innerHTML = Object.keys(RACES).map(x=>`<option>${x}</option>`).join('');
  const c = document.getElementById('cgClass');
  c.innerHTML = Object.keys(CLASSES).map(x=>`<option>${x}</option>`).join('');
}
function rollStats(){
  const m = document.getElementById('cgMethod').value;
  if(m==='V'){
    assignable = [fourDrop(),fourDrop(),fourDrop(),fourDrop(),fourDrop(),fourDrop()];
    ABILS.forEach((k,i)=> rolled[k]=assignable[i]);
  } else if(m==='I'){
    assignable = null;
    ABILS.forEach(k => rolled[k]=nd(3,6));
  } else {
    assignable = null;
    ABILS.forEach(k => rolled[k]=Math.max(nd(3,6), nd(3,6)));
  }
  refreshChargen();
}
function effective(){
  const race = document.getElementById('cgRace').value;
  const adj = RACES[race];
  const out = {};
  ABILS.forEach(k => out[k] = Math.max(3, Math.min(19, rolled[k] + adj[k])));
  return out;
}
function classOk(cls, stats){
  const mins = CLASSES[cls].mins;
  return Object.entries(mins).every(([k,v]) => stats[k] >= v);
}
function refreshChargen(){
  const race = document.getElementById('cgRace').value;
  const cls = document.getElementById('cgClass').value;
  const st = effective();
  const ban = RACES[race].ban || [];
  const ok = !ban.includes(cls) && classOk(cls, st);
  const box = document.getElementById('cgStats');
  box.innerHTML = ABILS.map(k => {
    const raw = rolled[k], eff = st[k];
    return `<span>${k.toUpperCase()}</span><span>${eff}</span><span class="hint">${raw!==eff?'('+raw+')':''}</span>`;
  }).join('');
  if(assignable){
    box.innerHTML += `<div style="grid-column:1/-1" class="hint">Click a score then another to swap (Method V)</div>`;
  }
  document.getElementById('cgWarn').textContent = ok ? 'Class requirements met.' :
    (ban.includes(cls) ? race+' cannot be '+cls+'.' : 'Scores miss '+cls+' minima.');
  box.querySelectorAll('span:nth-child(3n+2)').forEach((el,i) => {
    el.style.cursor = assignable ? 'pointer' : 'default';
    el.onclick = () => swapStat(i);
  });
}
let swapI = null;
function swapStat(i){
  if(!assignable) return;
  if(swapI==null){ swapI=i; return; }
  const keys = ABILS;
  const a = keys[swapI], b = keys[i];
  const t = rolled[a]; rolled[a]=rolled[b]; rolled[b]=t;
  swapI = null;
  refreshChargen();
}
function makeAvatar(name, race, cls, align, st){
  const hd = CLASSES[cls].hd;
  const mhp = hd + Math.max(0, mod(st.con));
  const psp = cls==='Psionicist' ? st.wis*2 + st.con + 2 : 0;
  return {
    name, race, cls, align, level:1, ...st,
    hp:mhp, mhp, psp, mpsp:psp,
    ac: 10 + mod(st.dex),
    xp:0, exceptional: null
  };
}
function confirmAvatar(){
  const race = document.getElementById('cgRace').value;
  const cls = document.getElementById('cgClass').value;
  const st = effective();
  if((RACES[race].ban||[]).includes(cls) || !classOk(cls, st)){
    alert('Fix race/class or reroll.');
    return;
  }
  if(cls==='Fighter'||cls==='Paladin'||cls==='Ranger'||cls==='Barbarian'||cls==='Cavalier'){
    if(st.str===18){
      const p = Math.floor(Math.random()*100)+1;
      st.exceptional = p;
    }
  }
  G.avatar = makeAvatar(document.getElementById('cgName').value || 'Avatar', race, cls, document.getElementById('cgAlign').value, st);
  G.gold = 40 + nd(3,6)*10;
  G.pack = [
    rollItem('trash', 2),
    {name:'Rations', slot:'junk', rarity:'Common', ilvl:1, shown:'Common Rations', id:true, val:1}
  ];
  log('You step through the morning fog onto Harbor of the Silent Bell.');
  log('Merrick the dock watch nods. Loyalty '+G.companion.loyalty+'.');
  hud(); show('world');
}
function quickStart(){
  fillSelects();
  document.getElementById('cgMethod').value='V';
  rollStats();
  // force a legal fighter-ish set
  rolled = {str:16,dex:14,con:15,int:11,wis:13,cha:10};
  document.getElementById('cgRace').value='Human';
  document.getElementById('cgClass').value='Fighter';
  confirmAvatar();
}

/* -------- world -------- */
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const TS = 28;

function resizeWorld(){
  view.width = view.clientWidth;
  view.height = view.clientHeight;
}
function drawWorld(){
  const ctx = vctx;
  ctx.fillStyle = '#0b100c';
  ctx.fillRect(0,0,view.width,view.height);
  const camx = G.px*TS - view.width/2 + TS/2;
  const camy = G.py*TS - view.height/2 + TS/2;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const t = TILE[worldMap[y][x]];
      const sx = x*TS - camx, sy = y*TS - camy;
      ctx.fillStyle = t.c;
      ctx.fillRect(sx, sy, TS-1, TS-1);
      if(!t.walk){
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.fillRect(sx, sy, TS-1, 6);
      }
    }
  }
  // npcs
  NPCs.forEach(n => {
    const sx = n.x*TS - camx + 6, sy = n.y*TS - camy + 4;
    ctx.fillStyle = n.color;
    ctx.fillRect(sx, sy, 16, 20);
    ctx.fillStyle = '#f0e0c0';
    ctx.fillRect(sx+4, sy+2, 8, 7);
  });
  // player
  const psx = G.px*TS - camx + 6, psy = G.py*TS - camy + 4;
  ctx.fillStyle = '#c9a227';
  ctx.fillRect(psx, psy, 16, 20);
  ctx.fillStyle = '#f5d0a0';
  ctx.fillRect(psx+4, psy+2, 8, 7);
}
function tileAt(x,y){
  if(y<0||x<0||y>=H||x>=W) return TILE[11];
  return TILE[worldMap[y][x]];
}
function tryMove(dx,dy){
  const nx = G.px+dx, ny = G.py+dy;
  const t = tileAt(nx,ny);
  if(!t.walk){ log('Blocked.'); return; }
  G.px=nx; G.py=ny;
  drawWorld();
  const n = NPCs.find(p => p.x===nx && p.y===ny);
  if(n) talk(n);
}

const NPCs = [
  {id:'merrick', name:'Merrick', x:10, y:11, color:'#6a7a4a', line:'Harbor watch. Stables went quiet last night. Too quiet. I will walk with thee if thou wilt have me.'},
  {id:'branna', name:'Branna the innkeep', x:5, y:6, color:'#8a5a3a', line:'Beds, stew, and rumors. A blacksmith\'s apprentice never came back from the stables.'},
  {id:'holg', name:'Holg Smith', x:17, y:8, color:'#888', line:'I forge, temper, and masterwork — if thou hast coin and mats. I do not haggle like the Cup.'},
  {id:'vena', name:'Vena of the Cup', x:25, y:9, color:'#6a4a7a', line:'Put coin in the Cup. Name a slot. Walk away richer or poorer. No pity.'},
  {id:'quire', name:'Quire of the Hall', x:18, y:2, color:'#4a5a7a', line:'The board prices what the stalls cannot see. Area cap still binds us.'},
  {id:'sel', name:'Sel the acolyte', x:5, y:3, color:'#c8c0a0', line:'The Bell rang off-key at dawn. Respec and blessing live here. Do not bring blood to the step.'}
];

function talk(n){
  log('<b>'+n.name+':</b> '+n.line);
  if(n.id==='merrick'){
    openModal(`<h2>Merrick</h2><p>${n.line}</p>
      <button onclick="G.partyHasMerrick=true;log('Merrick falls in. Loyalty 45.');closeModal();renderSide();">Join party</button>
      <button class="ghost" onclick="closeModal()">Leave him</button>`);
    return;
  }
  if(n.id==='holg') { openSmith(); return; }
  if(n.id==='vena') { openCup(); return; }
  if(n.id==='quire') { openAuction(); return; }
  if(n.id==='sel') { openTemple(); return; }
  openModal(`<h2>${n.name}</h2><p>${n.line}</p><button onclick="closeModal()">Close</button>`);
}

function interactHere(){
  const t = tileAt(G.px, G.py);
  if(t.enter==='stables'){
    log('The stalls are dark. Flies. A body — the apprentice — arranged with ritual care. A grate in the floor leads down.');
    openModal(`<h2>Stables</h2><p>The apprentice lies arranged with ritual care. A grate leads down.</p>
      <button onclick="closeModal();startCombat('sewer')">Descend</button>
      <button class="ghost" onclick="closeModal()">Step back</button>`);
    return;
  }
  if(t.enter==='sewer'){ startCombat('sewer'); return; }
  if(t.enter==='smith') openSmith();
  if(t.enter==='cup') openCup();
  if(t.enter==='auction') openAuction();
  if(t.enter==='temple') openTemple();
  if(t.enter==='tavern') log('Fire, stew, a room lute. Conversation ducks the music. (Slice: flavor only.)');
  const n = NPCs.find(p => Math.abs(p.x-G.px)+Math.abs(p.y-G.py)<=1);
  if(n && t.enter===undefined) talk(n);
}

function renderSide(){
  const a = G.avatar;
  if(!a) return;
  document.getElementById('sheet').innerHTML = `
    <h2>${a.name}</h2>
    <div>${a.race} ${a.cls} · ${a.align}</div>
    <div class="hp"><i style="width:${100*a.hp/a.mhp}%"></i></div>
    <div>HP ${a.hp}/${a.mhp} · AC ${a.ac} · L${a.level}/30</div>
    ${a.psp?`<div>PSP ${a.psp}/${a.mpsp}</div>`:''}
    <div>STR ${a.str} DEX ${a.dex} CON ${a.con}<br>INT ${a.int} WIS ${a.wis} CHA ${a.cha}</div>
    <div class="gold">${G.gold} gp</div>
    <div class="hint">${G.partyHasMerrick?'Party: Avatar + Merrick + 2 open + 0 pets':'Party: Avatar · 3 slots open'}</div>
    <button onclick="interactHere()">Interact / enter</button>
    <button class="ghost" onclick="show('title')">Quit to title</button>
    ${isPhone()?`<button onclick="toggleSheet()">Hide sheet</button>`:''}
  `;
  document.getElementById('inv').innerHTML = `
    <b>Pack</b>
    <table class="items">${G.pack.map((it,i)=>`<tr><td class="${RARITY_CLASS[it.rarity]||''}">${it.shown}</td><td>ilvl ${it.ilvl}</td>
      <td><button onclick="useItem(${i})">use</button></td></tr>`).join('')||'<tr><td>empty</td></tr>'}</table>
  `;
  hud();
}

function useItem(i){
  const it = G.pack[i];
  if(!it) return;
  if(it.slot==='use' && it.name.includes('Mending')){
    G.avatar.hp = Math.min(G.avatar.mhp, G.avatar.hp + 8);
    G.pack.splice(i,1);
    log('The potion knits flesh.');
  } else if(it.slot==='use' && it.name.includes('Identify') || it.shown.startsWith('Identify')){
    const u = G.pack.find(x => !x.id);
    if(!u){ log('Nothing unidentified.'); return; }
    u.id = true; u.shown = u.rarity+' '+u.name;
    G.pack.splice(i,1);
    log('The scroll names the thing: '+u.shown);
  } else {
    log('You turn '+it.shown+' over in your hands.');
  }
  renderSide();
}

/* shops */
function vendorPrice(it){
  const m = {Common:1, Uncommon:1.15, Rare:1.35, Epic:1.60, Legendary:2}[it.rarity] || 1;
  return Math.max(2, Math.round(it.val * m * 0.65));
}
function openSmith(){
  const fee = 15;
  window._stock = null;
  openModal(`<h2>Holg Smith</h2>
    <p>Forge, temper, masterwork. I do not haggle like the Cup.</p>
    <button onclick="smithDo('repair')">Repair — 5 gp</button>
    <button onclick="smithDo('forge')">Forge +1 ilvl — ${fee} gp</button>
    <button onclick="smithDo('mw')">Masterwork +1 — 40 gp</button>
    <button onclick="smithDo('buy')">Buy a stock blade</button>
    <button class="ghost" onclick="closeModal()">Leave</button>`);
}
function smithDo(kind){
  const fee = 15;
  if(kind==='repair'){ G.gold=Math.max(0,G.gold-5); log('Gear oiled.'); closeModal(); }
  if(kind==='forge' && G.gold>=fee){
    const it = G.pack.find(x => x.slot==='weapon'||x.slot==='armor');
    if(it){ it.ilvl=Math.min(it.ilvl+1, 4); G.gold-=fee; log('Forged '+it.shown+' to ilvl '+it.ilvl+' (area cap).'); }
    closeModal();
  }
  if(kind==='mw' && G.gold>=40){
    const it = G.pack.find(x => x.rarity!=='Common');
    if(it){ it.mw=(it.mw||0)+1; it.dmg=(it.dmg||0)+1; G.gold-=40; log('Masterwork rank '+(it.mw)+' on '+it.shown); }
    closeModal();
  }
  if(kind==='buy'){
    const it = rollItem('vendor', 3);
    const p = vendorPrice(it);
    openModal(`<h2>Holg shrugs</h2><p class="${RARITY_CLASS[it.rarity]}">${it.shown}</p><p>${p} gp. He does not know its true value.</p>
      <button onclick="if(G.gold>=${p}){G.gold-=${p};G.pack.push(window._stock);log('Bought '+window._stock.shown);}else log('Not enough coin.');closeModal();renderSide();">Buy</button>
      <button class="ghost" onclick="closeModal()">No</button>`);
    window._stock = it;
  }
  renderSide();
}
function openCup(){
  const stake = 24;
  if(G.gold<stake){ log('The Cup wants '+stake+' gp.'); return; }
  openModal(`<h2>The Cup</h2><p>${stake} gp. Random item, fence weights, open table. No pity.</p>
    <button onclick="doCup(${stake})">Drop coin</button>
    <button class="ghost" onclick="closeModal()">Walk away</button>`);
}
function doCup(stake){
  G.gold -= stake;
  const it = rollItem('fence', 3);
  it.id = true; it.shown = it.rarity+' '+it.name;
  G.pack.push(it);
  log('The Cup spills a '+it.shown+' (ilvl '+it.ilvl+').');
  closeModal(); renderSide();
}
function openAuction(){
  const listings = [rollItem('vendor',3), rollItem('fence',3), rollItem('chest',3)];
  listings.forEach(it => { it.id = it.rarity==='Common'||it.rarity==='Uncommon'; it.shown = it.id? it.rarity+' '+it.name : 'Unidentified item'; });
  window._ah = listings;
  openModal(`<h2>Auction hall</h2><p>Prices closer to true value. Area cap holds.</p>` +
    listings.map((it,i)=>`<button onclick="buyAh(${i})">${it.shown} — ${Math.round(vendorPrice(it)*1.5)} gp</button>`).join('') +
    `<button class="ghost" onclick="closeModal()">Leave</button>`);
}
function buyAh(i){
  const it = window._ah[i];
  const p = Math.round(vendorPrice(it)*1.5);
  if(G.gold>=p){ G.gold-=p; G.pack.push(it); log('Hall sold you '+it.shown); }
  else log('The clerk does not blink. No coin, no goods.');
  closeModal(); renderSide();
}
function openTemple(){
  const fee = 50 * G.avatar.level * G.avatar.level;
  openModal(`<h2>Temple of the Bell</h2>
    <p>Respec arrangement of the rolled six for ${fee} gp. Cannot reroll dice.</p>
    <button onclick="doRespec(${fee})">Pay and rearrange</button>
    <button class="ghost" onclick="closeModal()">Leave</button>`);
}
function doRespec(fee){
  if(G.gold<fee){ log('The acolyte waits.'); closeModal(); return; }
  const vals = ABILS.map(k => G.avatar[k]);
  const rot = vals.slice(1).concat(vals[0]);
  ABILS.forEach((k,i)=> G.avatar[k]=rot[i]);
  G.gold -= fee;
  log('The Bell accepts a rotation of the six (STR←CHA cycle). Full assign on desktop later.');
  closeModal(); renderSide();
}

/* -------- combat -------- */
const grid = document.getElementById('grid');
const gctx = grid.getContext('2d');
let combat = null;

function resizeGrid(){
  grid.width = grid.clientWidth || window.innerWidth;
  grid.height = (grid.clientHeight || window.innerHeight-160);
}

function startCombat(where){
  const enemies = where==='sewer' ? [
    makeFoe('Sewer Rat', 1, 8, 2, 'trash'),
    makeFoe('Sewer Rat', 1, 8, 2, 'trash'),
    makeFoe('Fat Rat', 2, 16, 4, 'elite')
  ] : [makeFoe('Brigand', 2, 14, 4, 'standard')];
  const units = [];
  const av = G.avatar;
  units.push({
    id:'player', name:av.name, side:'pc',
    hp:av.hp, mhp:av.mhp, ac:av.ac, str:av.str, dex:av.dex, con:av.con, int:av.int, wis:av.wis,
    cls:av.cls, placeInit: d(20)+mod(av.wis)+mod(av.int),
    atkInit: d(20)+mod(av.dex),
    x:null,y:null, stealth: av.cls==='Thief'||av.cls==='Assassin'||av.cls==='Psionicist'||av.cls==='Mage'
  });
  if(G.partyHasMerrick){
    units.push({
      id:'merrick', name:'Merrick', side:'pc', hp:G.companion.hp, mhp:G.companion.mhp,
      ac:14, str:15, dex:12, con:14, int:9, wis:11, cls:'Fighter',
      placeInit: d(20)+mod(11)+mod(9), atkInit: d(20)+mod(12),
      x:null,y:null, stealth:false, loyalty: G.companion.loyalty
    });
  }
  enemies.forEach(e => units.push(e));
  combat = {
    phase:'place', turn:0, selected:null,
    units,
    orderPlace: [...units].sort((a,b)=>b.placeInit-a.placeInit),
    placeIdx: 0,
    log: []
  };
  clog('Placement initiative:');
  combat.orderPlace.forEach(u => clog(u.name+' place-init '+u.placeInit+(u.stealth?' (may attempt rear)':'')));
  show('combat');
  autoPlaceIfNeeded();
}
function makeFoe(name, ilvl, hp, dmg, threat){
  return {
    id:'e'+Math.random().toString(36).slice(2,6), name, side:'en',
    hp, mhp:hp, ac:11+ilvl, str:10+ilvl, dex:12, con:10, int:6, wis:8, cls:'Beast',
    placeInit: d(20)+mod(8)+mod(6), atkInit: d(20)+mod(12),
    x:null,y:null, stealth:false, ilvl, dmg, threat
  };
}
function clog(s){ combat.log.unshift(s); renderCombatUI(); }
const GW=10, GH=8, CONTACT=4;
function cellSize(){
  return Math.min((grid.width-20)/GW, (grid.height-20)/GH);
}
function drawGrid(){
  const ctx = gctx, s = cellSize();
  ctx.fillStyle = '#14140f';
  ctx.fillRect(0,0,grid.width,grid.height);
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const px=10+x*s, py=10+y*s;
      ctx.fillStyle = x < CONTACT ? '#243028' : '#2a2220';
      if(x===CONTACT) ctx.fillStyle = '#3a3020';
      ctx.fillRect(px,py,s-2,s-2);
    }
  }
  if(!combat) return;
  combat.units.forEach(u => {
    if(u.x==null) return;
    const px=10+u.x*s+4, py=10+u.y*s+4;
    ctx.fillStyle = u.side==='pc' ? '#c9a227' : '#8b2a2a';
    if(u.hp<=0) ctx.fillStyle = '#444';
    ctx.fillRect(px, py, s-10, s-10);
    ctx.fillStyle = '#eee';
    ctx.font = '11px sans-serif';
    ctx.fillText(u.name.slice(0,6), px, py-2);
  });
}
function occ(x,y){ return combat.units.find(u => u.x===x && u.y===y && u.hp>0); }
function currentPlacer(){ return combat.orderPlace[combat.placeIdx]; }
function autoPlaceIfNeeded(){
  const u = currentPlacer();
  if(!u) { beginAttackPhase(); return; }
  if(u.side==='en'){
    const minX = u.stealth? 0 : CONTACT;
    let placed=false;
    for(let tries=0;tries<40 && !placed;tries++){
      const x = minX + Math.floor(Math.random()*(GW-minX));
      const y = Math.floor(Math.random()*GH);
      if(!occ(x,y)){ u.x=x; u.y=y; placed=true; }
    }
    clog(u.name+' takes a cell.');
    combat.placeIdx++;
    drawGrid(); renderCombatUI();
    setTimeout(autoPlaceIfNeeded, 280);
  } else {
    clog('Place '+u.name+' on YOUR half (left of the line). Stealth/invis may try the right.');
    drawGrid(); renderCombatUI();
  }
}
function clickGrid(ev){
  if(!combat || combat.phase!=='place') {
    if(combat && combat.phase==='fight') clickFight(ev);
    return;
  }
  const u = currentPlacer();
  if(!u || u.side!=='pc') return;
  const s = cellSize();
  const x = Math.floor((ev.offsetX-10)/s);
  const y = Math.floor((ev.offsetY-10)/s);
  if(x<0||y<0||x>=GW||y>=GH) return;
  if(occ(x,y)) { clog('Occupied.'); return; }
  const rear = x >= CONTACT;
  if(rear){
    if(!u.stealth){ clog('Only stealth or invisibility may stand behind the line.'); return; }
    const depth = x - CONTACT + 1;
    const leaderDist = 3;
    const det = 10 + d(20) + 1;
    const pl = d(20) + mod(u.dex) - depth*2 - leaderDist;
    if(pl >= det+5){ u.x=x; u.y=y; u.hidden=true; clog(u.name+' slips unseen into the rear.'); }
    else if(pl > det){ u.x=x; u.y=y; clog(u.name+' holds the rear, seen.'); }
    else {
      u.x = CONTACT-1; u.y = y;
      clog('Detected. Snapped to your half.');
      if(det - pl >= 5) u.atkInit -= 2;
    }
  } else {
    u.x=x; u.y=y;
    clog(u.name+' set.');
  }
  combat.placeIdx++;
  drawGrid();
  autoPlaceIfNeeded();
}
function beginAttackPhase(){
  combat.phase='fight';
  combat.orderAtk = combat.units.filter(u=>u.hp>0).sort((a,b)=>b.atkInit-a.atkInit);
  combat.atkIdx=0;
  clog('Attack initiative:');
  combat.orderAtk.forEach(u => clog(u.name+' atk-init '+u.atkInit));
  nextAct();
}
function actor(){ return combat.orderAtk[combat.atkIdx]; }
function nextAct(){
  if(combat.units.filter(u=>u.side==='en'&&u.hp>0).length===0){ victory(); return; }
  if(combat.units.filter(u=>u.side==='pc'&&u.hp>0).length===0){ defeat(); return; }
  while(combat.atkIdx < combat.orderAtk.length && actor().hp<=0) combat.atkIdx++;
  if(combat.atkIdx >= combat.orderAtk.length){
    combat.orderAtk = combat.units.filter(u=>u.hp>0).sort((a,b)=>b.atkInit-a.atkInit);
    combat.atkIdx=0;
    clog('— new round —');
  }
  const u = actor();
  if(u.side==='en'){ setTimeout(()=>aiAct(u), 350); }
  else {
    if(u.id==='merrick' && G.companion.loyalty < 40 && Math.random()<0.25){
      clog('Merrick refuses a reckless order and strikes the nearest rat instead.');
    }
    clog(u.name+' — Action / click an enemy in reach (1 square), or click a near empty cell to move.');
    combat.waiting = u;
  }
  drawGrid(); renderCombatUI();
}
function dist(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }
function clickFight(ev){
  const u = combat.waiting;
  if(!u) return;
  const s = cellSize();
  const x = Math.floor((ev.offsetX-10)/s);
  const y = Math.floor((ev.offsetY-10)/s);
  const foe = occ(x,y);
  if(foe && foe.side!==u.side){
    if(dist(u,foe)>1 && u.cls!=='Mage' && u.cls!=='Psionicist'){ clog('Too far.'); return; }
    strike(u, foe);
    combat.waiting=null; combat.atkIdx++; nextAct();
    return;
  }
  if(!occ(x,y) && Math.abs(u.x-x)+Math.abs(u.y-y)<= moveSpeed(u)){
    u.x=x; u.y=y; clog(u.name+' moves.');
    drawGrid();
    return;
  }
}
function moveSpeed(u){
  let m = 4 + Math.floor(((u.dex||10)+(u.con||10))/4);
  return Math.max(3, m);
}
function strike(a,b){
  const roll = d(20) + mod(a.str||10);
  const hit = roll >= b.ac - 4;
  if(!hit){ clog(a.name+' misses '+b.name+' ('+roll+').'); return; }
  const dmg = Math.max(1, d(6)+mod(a.str||10) + (a.dmg||0));
  b.hp -= dmg;
  clog(a.name+' hits '+b.name+' for '+dmg+'.');
  if(b.hp<=0){ clog(b.name+' falls.'); if(b.side==='en') dropFrom(b); }
}
function aiAct(u){
  const foes = combat.units.filter(t=>t.side==='pc'&&t.hp>0);
  foes.sort((p,q)=>dist(u,p)-dist(u,q));
  const t = foes[0];
  if(!t){ combat.atkIdx++; nextAct(); return; }
  if(dist(u,t)>1){
    const dx = Math.sign(t.x-u.x), dy = Math.sign(t.y-u.y);
    const nx=u.x+dx, ny = dy && occ(nx,u.y) ? u.y+dy : u.y;
    if(!occ(nx, ny) && nx>=0&&ny>=0&&nx<GW&&ny<GH){ u.x=nx; u.y = occ(nx,u.y)?ny:u.y; }
    if(dist(u,t)>1){ clog(u.name+' skitters.'); combat.atkIdx++; nextAct(); return; }
  }
  strike(u,t);
  if(u.side==='en' && t.id==='player') G.avatar.hp = t.hp;
  combat.atkIdx++; nextAct();
}
function dropFrom(foe){
  const n = foe.threat==='elite' ? 1+d(2) : d(2)-1;
  for(let i=0;i<Math.max(1,n);i++){
    const it = rollItem(foe.threat||'trash', foe.ilvl||1);
    G.pack.push(it);
    clog('Loot: '+it.shown+' (ilvl '+it.ilvl+')');
    log('Loot: '+it.shown);
  }
}
function victory(){
  G.avatar.hp = combat.units.find(u=>u.id==='player').hp;
  G.avatar.xp += 40;
  if(G.avatar.xp>=100){ G.avatar.level=Math.min(30,G.avatar.level+1); G.avatar.xp=0; G.avatar.mhp+=d(CLASSES[G.avatar.cls].hd); G.avatar.hp=G.avatar.mhp; log('Level '+G.avatar.level+'.'); }
  clog('The last rat stills.');
  combat.phase='done';
  renderCombatUI();
}
function defeat(){
  G.avatar.hp = 1;
  clog('You crawl back to the dock.');
  combat.phase='done';
  renderCombatUI();
}
function renderCombatUI(){
  const box = document.getElementById('combatUI');
  if(!combat){ box.innerHTML=''; return; }
  const u = combat.phase==='place' ? currentPlacer() : actor();
  box.innerHTML = `
    <div><b>${combat.phase==='place'?'Placement':'Attack'}</b> ${u?(' · '+u.name):''}
      <button onclick="show('world');hud();renderSide();">Leave field</button>
      ${combat.phase==='done'?'<button onclick="show(\'world\');hud();renderSide();">Return to harbor</button>':''}
    </div>
    <div class="hint">${(combat.log||[]).slice(0,6).join(' · ')}</div>
  `;
}

grid.addEventListener('click', clickGrid);
window.addEventListener('keydown', e => {
  if(G.screen!=='world') return;
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w') tryMove(0,-1);
  if(k==='arrowdown'||k==='s') tryMove(0,1);
  if(k==='arrowleft'||k==='a') tryMove(-1,0);
  if(k==='arrowright'||k==='d') tryMove(1,0);
  if(k==='e' || k===' ') interactHere();
});
(function bindSwipe(){
  let x0=0,y0=0;
  view.addEventListener('touchstart', e => {
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  }, {passive:true});
  view.addEventListener('touchend', e => {
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.max(Math.abs(dx),Math.abs(dy))<28) return;
    if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1,0);
    else tryMove(0,dy>0?1:-1);
  }, {passive:true});
})();
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('resize', () => {
  if(G.screen==='world'){ resizeWorld(); drawWorld(); }
  if(G.screen==='combat'){ resizeGrid(); drawGrid(); }
});

fillSelects();
rollStats();
</script>
</body>
